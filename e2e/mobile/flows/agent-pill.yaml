appId: sh.paseo
---
- runFlow: lib/open-agent.yaml
- tapOn: Insert a saved prompt
- extendedWaitUntil:
    visible: Insert Code review
    timeout: 30000
- assertVisible: Insert Summary
- tapOn: Search saved prompts
- inputText: thread
- extendedWaitUntil:
    notVisible: Insert Code review
    timeout: 15000
- assertVisible: Insert Summary
- takeScreenshot: pill-search-thread
- tapOn: Search saved prompts
- eraseText
- inputText: review
- extendedWaitUntil:
    visible: Insert Code review
    timeout: 15000
- assertNotVisible: Insert Summary
- tapOn: Insert Code review
# The toast is gone by the time a slow driver looks; the text in the composer stays.
# The runner checks that nothing was sent.
- extendedWaitUntil:
    notVisible: Search saved prompts
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Review the diff for bugs, missing tests, and unclear names.*"
    timeout: 30000
- takeScreenshot: pill-inserted
